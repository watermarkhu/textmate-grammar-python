name: Qualify

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - closed
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs:
    name: Validate documentation
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
    with:
      push: false

  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python-versions: ${{ steps.get-versions.outputs.python-versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get Python versions from pyproject.toml
        id: get-versions
        run: |
          versions=$(grep -E "Programming Language :: Python :: 3\.[0-9]+" pyproject.toml | \
                    sed -E 's/.*Python :: (3\.[0-9]+).*/\1/' | \
                    sort -V | \
                    jq -R -s -c 'split("\n")[:-1]')
          echo "python-versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Found Python versions: $versions"

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.resolution }})
    needs: setup
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.python-versions) }}
        resolution: [highest, lowest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install oracle dependencies
        working-directory: test/differential/node_root
        run: npm ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ matrix.resolution }}-${{ github.head_ref || github.ref_name }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Install dependencies
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          UV_RESOLUTION: ${{ matrix.resolution }}
        run: uv sync --dev --group test --python "$PYTHON_VERSION" --resolution "$UV_RESOLUTION"

      - name: Ruff lint
        run: uv run ruff check --output-format=github src/

      - name: Ruff format
        run: uv run ruff format --check src/

      - name: Type check
        run: uv run ty check src/

      - name: Unit tests
        run: uv run pytest -v test/unit

      - name: Differential tests
        run: uv run pytest -v test/differential
