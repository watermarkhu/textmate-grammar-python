name: "CI"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - '.pre-commig-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**.py'
      - 'src/syntaxes/**'
      - 'test/**'

jobs:

  unit-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"

      - name: Install the project dependencies
        run: uv sync --no-dev --group test --python ${{ matrix.python-version }}

      - name: Test with pytest
        run: |
          uv run pytest -v test/unit

  regression-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        node-version: [20]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node dependencies
        run: |
          mkdir test/regression/node_root
          cp test/regression/index.js test/regression/node_root
          cd test/regression/node_root
          npm init -y
          npm install oniguruma typescript vscode-oniguruma vscode-textmate

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"

      - name: Install the project dependencies
        run: uv sync --no-dev --group test --python ${{ matrix.python-version }}

      - name: Test with pytest
        run: |
          uv run pytest -v test/regression
