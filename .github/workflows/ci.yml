name: "CI"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'prek.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - 'test/**'

jobs:

  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Install development tools
        run: uv sync --python 3.12

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Ruff format
        run: uv run ruff format --check src/

      - name: Type check
        run: uv run ty check src/

  unit-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Install the project dependencies
        run: uv sync --no-dev --group test --python ${{ matrix.python-version }}

      - name: Test with pytest
        run: |
          uv run pytest -v test/unit

  differential-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        node-version: [20]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install node dependencies
        run: |
          cd test/differential/node_root
          npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"

      - name: Install the project dependencies
        run: uv sync --no-dev --group test --python ${{ matrix.python-version }}

      - name: Test with pytest
        run: |
          uv run pytest -v test/differential
