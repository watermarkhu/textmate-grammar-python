name: Docs

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to check out and use to build the documentation
        type: string
        default: ""
      push:
        description: Deploy the built documentation to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - name: Build documentation with Zensical
        run: |
          uv sync --no-dev --group docs
          uv run zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        if: ${{ inputs.push }}
        with:
          path: site

      - uses: actions/deploy-pages@v5
        if: ${{ inputs.push }}
        id: deployment
