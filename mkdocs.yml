site_name: TextMate Grammar Python
site_description: A Python port of vscode-textmate's grammar tokenization engine.
site_url: https://watermarkhu.github.io/textmate-grammar-python/
repo_url: https://github.com/watermarkhu/textmate-grammar-python
repo_name: watermarkhu/textmate-grammar-python
edit_uri: edit/main/docs/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

watch:
  - README.md
  - mkdocs.yml
  - docs
  - src

nav:
  - Home:
      - Overview: index.md
      - Getting started: started.md
      - Bundled grammars and coverage: languages.md
      - Tokens and state: tokenization.md
      - API reference: api.md

theme:
  name: material
  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            docstring_options:
              ignore_init_summary: true
            docstring_section_style: list
            filters: ["!^_"]
            heading_level: 1
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: true
            relative_crossrefs: true
            scoped_crossrefs: true
            separate_signature: true
            show_bases: false
            show_inheritance_diagram: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true
            unwrap_annotated: true
