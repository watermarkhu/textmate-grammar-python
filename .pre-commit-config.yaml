repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.5.5
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
        pass_filenames: false
      # Run the formatter.
      - id: ruff-format
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
    - id: mypy
      additional_dependencies: ["types-pyyaml"]
      exclude: |
        (?x)^(
            example.py|
            test\/.*.py|
            docs\/.*.py
        )$

  - repo: local
    hooks:
    - id: uv-export
      name: export doc requirements from uv.lock
      entry: uv export --no-emit-project --no-dev --group doc --format requirements-txt -o docs/requirements.txt
      language: system
      pass_filenames: false
      files: ^(pyproject\.toml|uv\.lock)$
