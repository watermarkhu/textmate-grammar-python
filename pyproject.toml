[project]
name = "textmate-grammar-python"
version = "0.6.1"
description = "A lexer and tokenizer for grammar files as defined by TextMate and used in VSCode, implemented in Python."
authors = [{ name = "Mark Shui Hu", email = "watermarkhu@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["textmate", "tokenization"]
requires-python = ">=3.10"
dependencies = [
    "onigurumacffi>=1.3.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "charset-normalizer>=3.3.2,<4.0.0",
]

[project.urls]
Repository = "https://github.com/watermarkhu/textmate-grammar-python"
Documentation = "https://textmate-grammar-python.readthedocs.io"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-icdiff>=0.8,<0.10",
]
dev = [
    "pre-commit>=3.6.0,<5.0.0",
    "mypy>=1.10.0,<2.0.0",
    "ruff>=0.5.0,<0.17.0",
    "types-pyyaml>=6.0.12.12,<7.0.0",
]
doc = [
    "sphinx>=7.2.6,<8.0.0",
    "sphinx-autodoc2>=0.5.0,<0.6.0",
    "myst-parser>=3.0.0,<4.0.0",
    "furo>=2024.1.29,<2026.0.0",
    "sphinxcontrib-mermaid>=0.9.2,<0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textmate_grammar"]

[tool.uv]
managed = true

[tool.ruff]
include = ["pyproject.toml", "src/textmate_grammar/**/*.py"]
exclude = ["src/textmate_grammar/grammars/"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E111", "E114", "E117", "E501", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.mypy]
ignore_missing_imports = true
exclude = ["test/*", "docs/*", "example.py"]
