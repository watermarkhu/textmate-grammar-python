[project]
name = "textmate-grammar-python"
version = "1.0.0"
description = "A Python port of the vscode-textmate grammar tokenization engine."
authors = [{ name = "Mark Shui Hu", email = "watermarkhu@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["textmate", "vscode", "grammar", "tokenization", "syntax-highlighting"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "onigurumacffi>=1.3.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "charset-normalizer>=3.3.2,<4.0.0",
]

[project.urls]
Repository = "https://github.com/watermarkhu/textmate-grammar-python"
Documentation = "https://textmate-grammar-python.readthedocs.io"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-icdiff>=0.8,<0.10",
]
dev = [
    "prek==0.5.7",
    "ruff==0.17.3",
    "ty==0.0.94",
    "types-pyyaml>=6.0.12.12,<7.0.0",
]
doc = [
    "sphinx>=9.2.0,<9.3.0; python_version >= '3.11'",
    "sphinx>=9.2.0,<9.3.0; python_version < '3.11'",
    "sphinx-autodoc2>=0.5.0,<0.6.0",
    "myst-parser>=5.0.0,<6.0.0; python_version >= '3.11'",
    "myst-parser>=3.0.0,<4.0.0; python_version < '3.11'",
    "furo>=2024.1.29,<2026.0.0",
    "sphinxcontrib-mermaid>=0.9.2,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textmate_grammar"]

[tool.uv]
managed = true

[tool.ruff]
include = ["pyproject.toml", "src/textmate_grammar/**/*.py"]
exclude = ["src/textmate_grammar/grammars/"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E111", "E114", "E117", "E501", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
