[project]
name = "textmate-grammar-python"
version = "1.0.0"
description = "A Python port of the vscode-textmate grammar tokenization engine."
authors = [{ name = "Mark Shui Hu", email = "watermarkhu@gmail.com" }]
license = "MIT"
readme = "README.md"
keywords = ["textmate", "vscode", "grammar", "tokenization", "syntax-highlighting"]
requires-python = ">=3.10, <3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "cffi>=2.1.1,<3.0.0",
    "onigurumacffi>=1.5.0,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "charset-normalizer>=3.3.2,<4.0.0",
]

[project.urls]
Repository = "https://github.com/watermarkhu/textmate-grammar-python"
Documentation = "https://watermarkhu.github.io/textmate-grammar-python/"

[dependency-groups]
test = [
    "icdiff>=2.0.1,<3.0.0",
    "pprintpp>=0.4.0,<0.5.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-icdiff>=0.8,<0.10",
]
dev = [
    "prek==0.5.9",
    "ruff==0.17.3",
    "ty==0.0.95",
    "types-pyyaml>=6.0.12.12,<7.0.0",
]
docs = [
    "mkdocstrings>=1.0,<2.0",
    "mkdocstrings-python>=2.0,<3.0",
    "pymdown-extensions>=12.3,<13.0; python_version >= '3.11'",
    "pymdown-extensions<12.2; python_version < '3.11'",
    "zensical>=0.0.29,<0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textmate_grammar"]

[tool.uv]
managed = true

[tool.ruff]
include = ["pyproject.toml", "src/textmate_grammar/**/*.py"]
exclude = ["src/textmate_grammar/grammars/"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E111", "E114", "E117", "E501", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
